[package]
name = "splayer-next-mobile"
version = "1.0.0"
description = "SPlayer Next for iOS and iPadOS"
authors = ["SPlayer-Dev contributors"]
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "splayer_next_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "gzip", "deflate"] }
tauri-plugin-ipa-update = { path = "plugins/ipa-update" }
tauri-plugin-lyric-pip = { path = "plugins/lyric-pip" }
tauri-plugin-native-audio = { path = "plugins/native-audio" }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioSession", "AVAudioSessionTypes"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# 上游 #1245：场景配置必须延迟释放，否则 Release 包在 UIKit 接管窗口前访问悬空指针。
tao = { git = "https://github.com/tauri-apps/tao", rev = "f2163508104413ef0609178dcebdd5803b496211" }
tauri-plugin-dialog = { path = "vendor/tauri-plugin-dialog-2.7.3" }
