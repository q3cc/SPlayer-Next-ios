name: SPlayerNative
options:
  deploymentTarget:
    iOS: "16.0"
  projectFormat: xcode15_0
packages:
  SPlayerNativeUI:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SPlayerNative:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SPlayerNativeUI
    settings:
      base:
        # 默认与原 iOS 版同包名同名称，安装即替换原版；共存版构建时覆盖为
        # APP_BUNDLE_ID=top.imsyy.splayer-next.native APP_DISPLAY_NAME="SPlayer Native"
        APP_BUNDLE_ID: top.imsyy.splayer-next.ios
        APP_DISPLAY_NAME: SPlayer Next
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "2026102801"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 听歌识曲需要访问麦克风。
        NSPhotoLibraryAddUsageDescription: 保存歌词海报到相册。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SPlayerNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SPlayerNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.imsyy.splayer-next.native.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SPlayerNative:
    build:
      targets:
        SPlayerNative: all
    test:
      targets: [SPlayerNativeUITests]
