<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/icons/favicon.ico" />
    <link rel="preload" href="/fonts/logo.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <title>SPlayer Next</title>
    <style>
      @font-face {
        font-family: "logo";
        src: url("/fonts/logo.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
      }
      body {
        background: #101014;
      }
      html.light body {
        background: #f6f6f6;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #e8e8ea;
        transition: opacity 0.3s;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      html.light #app-loading {
        background: #f6f6f6;
        color: #1a1a1c;
      }
      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transform: translateZ(0);
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        will-change: transform, opacity;
        animation:
          splash-rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both,
          splash-flicker 1.8s ease-in-out 0.5s infinite;
      }
      .splash-logo path:first-child {
        fill: #f55e55;
      }
      .splash-logo path:not(:first-child) {
        fill: #f9bbb8;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .splash-name {
        font-family: "logo", sans-serif;
        font-size: 34px;
        line-height: 1;
      }
      .splash-next {
        width: 98px;
        height: 24px;
        overflow: visible;
      }
      .splash-next .letter {
        stroke: currentColor;
        stroke-width: 10;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        will-change: stroke-dashoffset;
        animation: splash-draw 1s ease forwards;
      }
      .splash-next .letter:nth-child(1) {
        animation-delay: 0.2s;
      }
      .splash-next .letter:nth-child(2) {
        animation-delay: 0.45s;
      }
      .splash-next .letter:nth-child(3) {
        animation-delay: 0.7s;
      }
      .splash-next .letter:nth-child(4) {
        animation-delay: 0.95s;
      }
      .splash-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(20px + env(safe-area-inset-bottom));
        text-align: center;
        font-size: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        animation: splash-rise-footer 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.36s both;
      }
      #app-loading.boot-failed .splash-logo {
        animation: none;
      }
      #app-loading.boot-failed .splash-footer {
        bottom: calc(18px + env(safe-area-inset-bottom));
        padding: 0 24px;
        color: #f55e55;
        opacity: 0.85;
        animation: none;
      }
      .splash-retry {
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        background: #f55e55;
        color: white;
        font:
          600 14px/1 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      @keyframes splash-rise {
        from {
          transform: translateY(12px);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes splash-rise-footer {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 0.4;
          transform: translateY(0);
        }
      }
      @keyframes splash-flicker {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading {
          transition: none;
        }
        .splash-logo,
        .splash-footer,
        .splash-next .letter {
          animation: none;
        }
        .splash-next .letter {
          stroke-dashoffset: 0;
        }
      }
    </style>
    <script>
      // 记录 splash 动画起点
      window.__splashStart = performance.now();
      // 确定明暗模式
      (function () {
        let mode = "system";
        try {
          const raw = localStorage.getItem("theme");
          if (raw) mode = JSON.parse(raw).mode || "system";
        } catch (e) {}
        const isDark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!isDark) document.documentElement.classList.add("light");
      })();
    </script>
  </head>

  <body>
    <div id="app-loading">
      <div class="splash">
        <svg class="splash-logo" viewBox="0 0 1024 1024" role="img" aria-label="SPlayer">
          <path
            d="M511.764 131.708a446.146 446.146 0 1 0 446.146 446.146 446.146 446.146 0 0 0-446.146-446.146zm0 519.76a71.829 71.829 0 1 1 71.83-70.937 72.276 72.276 0 0 1-71.83 70.937z"
          />
          <path
            d="M802.205.541 634.008 37.571a67.814 67.814 0 0 0-53.091 66.03v120.013l3.569 349.778h114.213V223.614h108.86a26.323 26.323 0 0 0 26.769-26.322V26.864A26.769 26.769 0 0 0 802.205.541z"
          />
          <path
            d="M511.764 386.457a186.935 186.935 0 1 0 186.935 186.489 186.935 186.935 0 0 0-186.935-186.489zm0 264.565a71.383 71.383 0 1 1 71.383-71.383 71.383 71.383 0 0 1-71.383 71.383z"
          />
        </svg>
        <div class="splash-brand">
          <span class="splash-name">SPlayer</span>
          <svg class="splash-next" viewBox="15 15 450 110" aria-hidden="true">
            <path d="M20 120 L20 20 L100 120 L100 20" class="letter" />
            <path
              d="M140 20 L140 120 M140 20 L220 20 M140 70 L200 70 M140 120 L220 120"
              class="letter"
            />
            <path d="M260 20 L340 120 M340 20 L260 120" class="letter" />
            <path d="M380 20 L460 20 M420 20 L420 120" class="letter" />
          </svg>
        </div>
      </div>
      <div class="splash-footer">SPlayer Next · © 2026 imsyy</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
