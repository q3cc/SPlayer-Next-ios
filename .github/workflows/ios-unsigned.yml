name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ios-ipados
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - "src/**"
      - "electron/main/apis/**"
      - "scripts/ios-layout-tests/**"
      - "scripts/ios-update-tests/**"
      - "scripts/ios-siri-tests/**"
      - "scripts/configure-ios-siri.mjs"
      - "scripts/publish-action-update.cjs"
      - "src-tauri/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "vite.config.ts"
      - "vite.siri.config.ts"
      - "uno.config.ts"

permissions:
  contents: read

concurrency:
  # macOS runner 偶尔会卡在收尾阶段，按提交隔离并发组，避免阻塞新修复的验证。
  group: ios-unsigned-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ipa
            name: Unsigned iPhone and iPad IPA
            rust_targets: aarch64-apple-ios
            rust_cache_key: ""
          # 按实机测试流程临时停用模拟器任务，保留下面的测试步骤以便恢复。
          # - kind: smoke
          #   name: iPad startup smoke test
          #   rust_targets: aarch64-apple-ios-sim
          #   rust_cache_key: debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_cache_key }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Test Siri background APIs and native queue
        if: matrix.kind == 'ipa'
        run: |
          pnpm vite build --config vite.siri.config.ts --mode mobile
          node scripts/ios-siri-tests/background.test.mjs
          swiftc src-tauri/plugins/native-audio/ios/Sources/SiriQueue.swift scripts/ios-siri-tests/main.swift -o "$RUNNER_TEMP/splayer-siri-tests"
          "$RUNNER_TEMP/splayer-siri-tests"

      - name: Test native IPA range downloader
        if: matrix.kind == 'ipa'
        run: python3 scripts/ios-update-tests/test_download.py

      - name: Test native equalizer audio output
        if: matrix.kind == 'ipa'
        run: |
          swiftc src-tauri/plugins/native-audio/ios/Sources/AudioEffects.swift scripts/ios-audio-tests/main.swift -o "$RUNNER_TEMP/splayer-audio-tests"
          "$RUNNER_TEMP/splayer-audio-tests"

      - name: Test native lyric timeline
        if: matrix.kind == 'ipa'
        run: |
          swiftc src-tauri/plugins/lyric-pip/ios/Sources/LyricTimeline.swift scripts/ios-lyric-tests/main.swift -o "$RUNNER_TEMP/splayer-lyric-tests"
          "$RUNNER_TEMP/splayer-lyric-tests"

      - name: Install the SPlayer iOS icon set
        shell: bash
        run: |
          set -euo pipefail
          icon_set="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          cp src-tauri/icons/ios/*.png "$icon_set/"
          cmp src-tauri/icons/ios/AppIcon-512@2x.png "$icon_set/AppIcon-512@2x.png"

      - name: Build the unsigned iOS IPA
        if: matrix.kind == 'ipa'
        run: pnpm tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        if: matrix.kind == 'ipa'
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "Tauri did not produce an IPA" >&2
            exit 1
          fi
          cp "$ipa_path" SPlayer-Next-iOS-unsigned.ipa
          # 验证最终安装包确实开放文稿共享，不启动模拟器。
          inspect_dir="$(mktemp -d)"
          unzip -q "$ipa_path" 'Payload/*.app/Info.plist' -d "$inspect_dir"
          info_path="$(find "$inspect_dir/Payload" -name Info.plist -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$info_path")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$info_path")" = true
          python3 scripts/ios-siri-tests/verify-ipa.py "$ipa_path"

      - name: Upload unsigned IPA
        if: matrix.kind == 'ipa'
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
          path: SPlayer-Next-iOS-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build the iPad simulator application
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            simulator_target="aarch64-sim"
          else
            simulator_target="x86_64"
          fi
          device_id="$(xcrun simctl list devices available | sed -nE '/iPad.*11-inch/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          if [[ -z "$device_id" ]]; then
            echo "No available iPad simulator was found" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_TARGET=$simulator_target" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_DEVICE=$device_id" >> "$GITHUB_ENV"
          VITE_MOBILE_SMOKE=1 pnpm tauri ios build --debug --ci --no-sign --target "$simulator_target"

      - name: Smoke test first and second launch on iPad
        if: matrix.kind == 'smoke'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail

          timed() {
            local seconds="$1"
            shift
            perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
          }

          capture() {
            local name="$1"
            for attempt in 1 2 3; do
              if timed 15 xcrun simctl io "$device_id" screenshot "ios-smoke/$name.png"; then
                return 0
              fi
              printf '%s screenshot attempt %s timed out\n' "$name" "$attempt" \
                >> "ios-smoke/$name-screenshot-error.txt"
              sleep 2
            done
            return 1
          }

          wait_for_mount() {
            local boot_log="$1"
            for _ in {1..30}; do
              if [[ -f "$boot_log" ]] && grep -Fxq 'vue-mounted' "$boot_log"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_network() {
            local boot_log="$1"
            for _ in {1..90}; do
              if [[ -f "$boot_log" ]] && grep -Fxq 'network-smoke-ready' "$boot_log"; then
                return 0
              fi
              if [[ -f "$boot_log" ]] && grep -Fq 'network-smoke-failed:' "$boot_log"; then
                return 1
              fi
              sleep 1
            done
            return 1
          }

          launch_app() {
            local name="$1"
            local output="ios-smoke/$name.txt"

            for attempt in 1 2 3; do
              if timed 30 xcrun simctl launch "$device_id" top.imsyy.splayer-next.ios \
                >>"$output" 2>&1; then
                for _ in {1..30}; do
                  if [[ -f "$boot_log" ]] && grep -Fxq 'native-entry' "$boot_log"; then
                    return 0
                  fi
                  sleep 1
                done
              fi
              printf '\nlaunch attempt %s did not reach native-entry\n' "$attempt" >> "$output"
              timed 8 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true
              sleep 2
              rm -f "$boot_log"
            done
            return 1
          }

          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' \
            ! -path '*.xcarchive/*' -print -quit)"
          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "Tauri did not produce an iOS Simulator app" >&2
            find src-tauri/gen/apple/build -maxdepth 4 -print >&2 || true
            exit 1
          fi
          app_path="$(cd "$(dirname "$app_path")" && pwd)/$(basename "$app_path")"

          device_id="$IOS_SIMULATOR_DEVICE"

          mkdir -p ios-smoke
          printf 'app=%s\ndevice=%s\n' "$app_path" "$device_id" | tee ios-smoke/environment.txt
          # Hosted runner 偶尔遗留表面为 Booted、实际无法响应 launch/io 的模拟器，先冷启动。
          timed 30 xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
          timed 30 xcrun simctl boot "$device_id"
          timed 300 xcrun simctl bootstatus "$device_id" -b | tee ios-smoke/bootstatus.txt
          timed 240 xcrun simctl install "$device_id" "$app_path" 2>ios-smoke/install-error.txt
          data_container="$(xcrun simctl get_app_container "$device_id" top.imsyy.splayer-next.ios data)"
          boot_log="$data_container/tmp/splayer-boot.log"
          rm -f "$boot_log"

          launch_app first-launch || true
          first_mounted=1
          wait_for_mount "$boot_log" || first_mounted=0
          first_network=1
          wait_for_network "$boot_log" || first_network=0
          sleep 1
          capture first-launch
          cp "$boot_log" ios-smoke/first-boot.log 2>/dev/null || true
          timed 10 xcrun simctl spawn "$device_id" log show --last 2m --style compact \
            --predicate 'process == "SPlayer Next"' > ios-smoke/first-console.log 2>&1 || true
          timed 5 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true

          mv "$boot_log" ios-smoke/first-boot-complete.log 2>/dev/null || true
          launch_app second-launch || true
          second_mounted=1
          wait_for_mount "$boot_log" || second_mounted=0
          second_network=1
          wait_for_network "$boot_log" || second_network=0
          sleep 1
          capture second-launch || true
          cp "$boot_log" ios-smoke/second-boot.log 2>/dev/null || true
          timed 10 xcrun simctl spawn "$device_id" log show --last 2m --style compact \
            --predicate 'process == "SPlayer Next"' > ios-smoke/second-console.log 2>&1 || true
          timed 5 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true

          if ! compgen -G 'ios-smoke/first-launch*.png' > /dev/null; then
            echo "No first-launch screenshot was captured" >&2
            exit 1
          fi
          if ! compgen -G 'ios-smoke/second-launch*.png' > /dev/null; then
            echo "No second-launch screenshot was captured" >&2
            exit 1
          fi
          if [[ "$first_mounted" != 1 || "$second_mounted" != 1 ]]; then
            echo "The application did not reach vue-mounted on both launches" >&2
            exit 1
          fi
          if [[ "$first_network" != 1 ]]; then
            echo "The common recommendations or QR login smoke test failed" >&2
            exit 1
          fi
          if [[ "$second_network" != 1 ]]; then
            echo "The home recommendation UI smoke test failed" >&2
            exit 1
          fi

      - name: Verify iPad portrait and landscape layouts
        if: always() && matrix.kind == 'smoke' && env.IOS_SIMULATOR_DEVICE != ''
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec scripts/ios-layout-tests/project.yml
          test_status=0
          xcodebuild test -project scripts/ios-layout-tests/SPlayerLayoutTests.xcodeproj \
            -scheme LayoutTests -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_DEVICE" \
            -parallel-testing-enabled NO -resultBundlePath ios-smoke/layout.xcresult \
            CODE_SIGNING_ALLOWED=NO > ios-smoke/layout-tests.log 2>&1 || test_status=$?
          xcrun xcresulttool export attachments --path ios-smoke/layout.xcresult \
            --output-path ios-smoke/layout-screenshots || true
          data_container="$(xcrun simctl get_app_container "$IOS_SIMULATOR_DEVICE" top.imsyy.splayer-next.ios data)"
          cp "$data_container/tmp/splayer-boot.log" ios-smoke/layout-boot.log || true
          if [[ "$test_status" != 0 ]]; then
            tail -100 ios-smoke/layout-tests.log
            exit "$test_status"
          fi
          grep -Fxq 'layout-desktop-ready' ios-smoke/layout-boot.log
          grep -Fxq 'layout-mobile-ready' ios-smoke/layout-boot.log
          grep -Fxq 'player-edge-ready' ios-smoke/layout-boot.log
          grep -Fxq 'folder-picker-returned' ios-smoke/layout-boot.log

      - name: Upload iPad smoke-test diagnostics
        if: always() && matrix.kind == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iPad-smoke-${{ github.sha }}
          path: ios-smoke
          if-no-files-found: warn
          retention-days: 7

  publish-action:
    name: Publish Action update channel
    needs: build-ios
    if: github.repository == 'q3cc/SPlayer-Next-ios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-ios-action-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-action-update.cjs');
            await publish({ github, context });
