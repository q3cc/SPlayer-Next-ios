name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # 本仓库检查不运行桌面 Electron，也不重建桌面 SQLite。
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: pnpm prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        env:
          SKIP_NATIVE_BUILD: true

      - name: Frontend regression tests
        run: pnpm vitest run --maxWorkers=2

      - name: Siri background API and manifest tests
        run: |
          python3 scripts/ios-siri-tests/test_manifest.py
          pnpm vite build --config vite.siri.config.ts --mode mobile
          node scripts/ios-siri-tests/background.test.mjs
