name: iOS Native UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/ios-native/**"
      - "src/mobile/**"
      - "shared/**"
      - "src/apis/**"
      - "electron/main/plugins/**"
      - "electron/main/apis/**"
      - "src-tauri/plugins/native-audio/ios/Sources/**"
      - "vite.native*.config.ts"
      - "vite.siri.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-native-ui.yml"
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - "src-tauri/ios-native/**"
      - "src/mobile/**"
      - "shared/**"
      - "src/apis/**"
      - "electron/main/plugins/**"
      - "electron/main/apis/**"
      - "src-tauri/plugins/native-audio/ios/Sources/**"
      - "vite.native*.config.ts"
      - "vite.siri.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-native-ui.yml"

permissions:
  contents: read

jobs:
  swift-package:
    name: SwiftUI package tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: src-tauri/ios-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 原生界面使用 iOS 18 / 26 接口，需要 Xcode 26 及以上
      - name: Select Xcode 26
        run: |
          xcode_app=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -n 1)
          test -n "$xcode_app"
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcodebuild -version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Prepare shared platform and plugin services
        run: |
          cd ../..
          pnpm install --frozen-lockfile
          bash src-tauri/ios-native/scripts/prepare.sh

      - name: Resolve package
        run: swift package resolve

      - name: Build package
        run: swift build -c release

      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme SPlayerNativeUI
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO build

      - name: Run tests
        run: swift test

      - name: Generate native application project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned native application
        id: native_app
        run: >-
          xcodebuild -project SPlayerNative.xcodeproj -scheme SPlayerNative
          -destination 'generic/platform=iOS' -configuration Release
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned coexisting application
        id: coexist_app
        run: >-
          xcodebuild -project SPlayerNative.xcodeproj -scheme SPlayerNative
          -destination 'generic/platform=iOS' -configuration Release
          -derivedDataPath build/coexist CODE_SIGNING_ALLOWED=NO
          APP_BUNDLE_ID=top.imsyy.splayer-next.native "APP_DISPLAY_NAME=SPlayer Native" build

      # 不固定机型与系统版本，取 runner 上第一台可用的 iPhone 模拟器
      - name: Test native application on simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")))')
          xcodebuild -project SPlayerNative.xcodeproj -scheme SPlayerNative \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/simulator \
            -resultBundlePath build/NativeUITests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -collect-test-diagnostics never \
            -only-testing:SPlayerNativeUITests/NativeAppTests test

      - name: Test iPad layout and capture screenshot
        if: ${{ !cancelled() && steps.native_app.outcome == 'success' }}
        run: python3 scripts/test-ipad.py

      # 打包只依赖构建结果，模拟器测试失败时仍保留安装包便于排查
      - name: Package unsigned IPA
        if: ${{ !cancelled() && steps.native_app.outcome == 'success' && steps.coexist_app.outcome == 'success' }}
        run: |
          for variant in device:SPlayerNative-unsigned coexist:SPlayerNative-Coexist-unsigned; do
            mkdir -p "build/package-${variant%%:*}/Payload"
            cp -R "build/${variant%%:*}/Build/Products/Release-iphoneos/SPlayerNative.app" "build/package-${variant%%:*}/Payload/"
            (cd "build/package-${variant%%:*}" && zip -qry "../${variant##*:}.ipa" Payload)
          done

      - name: Upload native application and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPlayerNative-build
          path: |
            src-tauri/ios-native/build/SPlayerNative-unsigned.ipa
            src-tauri/ios-native/build/SPlayerNative-Coexist-unsigned.ipa
            src-tauri/ios-native/build/NativeUITests.xcresult
            src-tauri/ios-native/build/NativeIPadTests.xcresult
            src-tauri/ios-native/build/native-ipad*.png
            src-tauri/ios-native/build/native-ipad-accessibility.txt
          if-no-files-found: warn

  host-readiness:
    name: Check native host prerequisites
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native package and migration boundary
        run: |
          test -f src-tauri/ios-native/Package.swift
          test -f src-tauri/ios-native/Sources/SPlayerNativeUI/NativeRootView.swift
          test -f docs/maintenance/ios-native-migration.md

      - name: Test simulator evidence export
        run: python3 -B -m unittest discover -s src-tauri/ios-native/scripts -p 'test_*.py' -v
