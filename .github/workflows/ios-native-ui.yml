name: iOS Native UI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/ios-native/**"
      - ".github/workflows/ios-native-ui.yml"
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - "src-tauri/ios-native/**"
      - ".github/workflows/ios-native-ui.yml"

permissions:
  contents: read

jobs:
  swift-package:
    name: SwiftUI package tests
    runs-on: macos-14
    defaults:
      run:
        working-directory: src-tauri/ios-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve package
        run: swift package resolve

      - name: Build package
        run: swift build -c release

      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme SPlayerNativeUI
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO build

      - name: Run tests
        run: swift test

      - name: Generate native application project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned native application
        run: >-
          xcodebuild -project SPlayerNative.xcodeproj -scheme SPlayerNative
          -destination 'generic/platform=iOS' -configuration Release
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build

      - name: Test native application on simulator
        run: >-
          xcodebuild -project SPlayerNative.xcodeproj -scheme SPlayerNative
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
          -derivedDataPath build/simulator -resultBundlePath build/NativeUITests.xcresult
          CODE_SIGNING_ALLOWED=NO test

      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/SPlayerNative.app build/package/Payload/
          cd build/package
          zip -qry ../SPlayerNative-unsigned.ipa Payload

      - name: Test iPad layout and capture screenshot
        run: python3 scripts/test-ipad.py

      - name: Upload native application and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPlayerNative-build
          path: |
            src-tauri/ios-native/build/SPlayerNative-unsigned.ipa
            src-tauri/ios-native/build/NativeUITests.xcresult
            src-tauri/ios-native/build/NativeIPadTests.xcresult
            src-tauri/ios-native/build/native-ipad.png
          if-no-files-found: warn

  host-readiness:
    name: Check native host prerequisites
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native package and migration boundary
        run: |
          test -f src-tauri/ios-native/Package.swift
          test -f src-tauri/ios-native/Sources/SPlayerNativeUI/NativeRootView.swift
          test -f docs/maintenance/ios-native-migration.md
