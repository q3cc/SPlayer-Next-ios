name: iPad song playback and lyric PiP test

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "测试范围：原生均衡器或歌词小窗"
        type: choice
        options: [equalizer, pip]
        default: pip
      evidence_run_id:
        description: "仅复核已有测试截图时填写运行 ID；留空则实际播放"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-playback-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback:
    if: inputs.evidence_run_id == ''
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-playback-simulator
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build instrumented simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-playback
          pnpm tauri ios init --ci --skip-targets-install
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          if [[ "$(uname -m)" == arm64 ]]; then target=aarch64-sim; else target=x86_64; fi
          VITE_MOBILE_PLAYBACK_TEST=1 pnpm tauri ios build --debug --ci --no-sign --target "$target" \
            2>&1 | tee ios-playback/build.log
      - name: Boot and install on iPad
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timed() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          device_id="$(xcrun simctl list devices available | sed -nE '/iPad.*11-inch/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          test -n "$device_id"
          echo "IOS_PLAYBACK_DEVICE=$device_id" >> "$GITHUB_ENV"
          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' ! -path '*.xcarchive/*' -print -quit)"
          test -d "$app_path"
          timed 30 xcrun simctl shutdown "$device_id" || true
          timed 30 xcrun simctl boot "$device_id"
          timed 300 xcrun simctl bootstatus "$device_id" -b | tee ios-playback/boot.log
          timed 120 xcrun simctl install "$device_id" "$app_path"
          xcrun simctl status_bar "$device_id" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Test missing Siri signing capability
        timeout-minutes: 2
        run: |
          xcrun --sdk iphonesimulator clang -target "$(uname -m)-apple-ios16.0-simulator" \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -fobjc-arc -fblocks -framework Foundation -framework Intents -framework Security \
            -I src-tauri/plugins/native-audio/ios/AuthorizationBridge/include \
            src-tauri/plugins/native-audio/ios/AuthorizationBridge/SiriAuthorization.m \
            scripts/ios-siri-tests/authorization.m -o "$RUNNER_TEMP/splayer-siri-auth-tests"
          codesign --force --sign - "$RUNNER_TEMP/splayer-siri-auth-tests"
          xcrun simctl spawn "$IOS_PLAYBACK_DEVICE" "$RUNNER_TEMP/splayer-siri-auth-tests"
      - name: Play 千本樱 and verify selected feature
        timeout-minutes: 12
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          test_case="testSenbonzakuraPlaybackAndPiP"
          if [[ "$TEST_SCOPE" == "equalizer" ]]; then
            test_case="testNativeEqualizerPlayback"
          fi
          xcodegen generate --spec scripts/ios-layout-tests/project.yml
          xcodebuild test -project scripts/ios-layout-tests/SPlayerLayoutTests.xcodeproj \
            -scheme LayoutTests -destination "platform=iOS Simulator,id=$IOS_PLAYBACK_DEVICE" \
            "-only-testing:LayoutTests/PlaybackTests/$test_case" -parallel-testing-enabled NO \
            -resultBundlePath ios-playback/playback.xcresult CODE_SIGNING_ALLOWED=NO \
            > ios-playback/test.log 2>&1
      - name: Collect screenshots and application logs
        if: always()
        shell: bash
        run: |
          mkdir -p ios-playback
          if [[ -d ios-playback/playback.xcresult ]]; then
            xcrun xcresulttool export diagnostics --path ios-playback/playback.xcresult \
              --output-path ios-playback/diagnostics || true
            xcrun xcresulttool export attachments --path ios-playback/playback.xcresult \
              --output-path ios-playback/screenshots || true
          fi
          if [[ -n "${IOS_PLAYBACK_DEVICE:-}" ]]; then
            perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl io "$IOS_PLAYBACK_DEVICE" screenshot ios-playback/final-screen.png || true
            data_container="$(xcrun simctl get_app_container "$IOS_PLAYBACK_DEVICE" top.imsyy.splayer-next.ios data)"
            cp -R "$data_container/Documents/logs" ios-playback/app-logs || true
            perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl spawn "$IOS_PLAYBACK_DEVICE" log show \
              --last 10m --style compact --predicate 'process CONTAINS "splayer"' \
              > ios-playback/system.log 2>&1 || true
          fi
          tail -100 ios-playback/test.log 2>/dev/null || true
      - name: Verify PiP screenshots contain visible content
        if: always() && env.IOS_PLAYBACK_DEVICE != '' && inputs.scope != 'equalizer'
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/pip-image-check" 'Pillow>=12,<13'
          PYTHONPATH="$RUNNER_TEMP/pip-image-check" python3 scripts/ios-layout-tests/check-pip-screenshots.py ios-playback/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPad-Senbonzakura-PiP-${{ github.sha }}
          path: ios-playback
          if-no-files-found: warn
          retention-days: 7

  verify-evidence:
    if: inputs.evidence_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          pattern: iPad-Senbonzakura-PiP-*
          merge-multiple: true
          path: ios-playback
      - name: Check the recorded PiP screenshots
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/pip-image-check" 'Pillow>=12,<13'
          PYTHONPATH="$RUNNER_TEMP/pip-image-check" python3 scripts/ios-layout-tests/check-pip-screenshots.py ios-playback/screenshots
