name: Inspect iOS test crash diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "要复核的 iPad 测试运行 ID"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: iPad-Senbonzakura-PiP-*
          merge-multiple: true
          path: evidence
      - name: Export Xcode diagnostics
        run: |
          xcrun xcresulttool export diagnostics --path evidence/playback.xcresult --output-path diagnostics
          find diagnostics -type f -name '*.zip' -print0 | while IFS= read -r -d '' file; do
            ditto -x -k "$file" "${file%.zip}"
          done
          find diagnostics -type f \( -name '*.ips' -o -name '*.crash' \) -print -exec head -150 {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-crash-diagnostics-${{ inputs.run_id }}
          path: diagnostics
          retention-days: 7
